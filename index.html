<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>见 · 一段盲道</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; top: 0; left: 0; display: block; pointer-events: none; }

  /* 顶部导航栏 */
  #topBar {
    position: fixed; top: 0; left: 0; width: 100%; height: 40px;
    display: flex; align-items: center; justify-content: space-around;
    background: rgba(20,20,20,0.8); z-index: 10;
    color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(5px);
  }
  #topBar .tab { padding: 0 20px; cursor: pointer; transition: color 0.3s; }
  #topBar .tab.active { color: #f5c842; }

  /* 任务提示 */
  #quest {
    position: fixed; top: 60px; right: 40px;
    color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 2px;
    z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #quest::before { content: '❗'; margin-right: 8px; font-size: 12px; color: #f5c842; }

  /* 底部左侧摇杆 */
  #joystick {
    position: fixed; bottom: 40px; left: 40px;
    width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.15);
    z-index: 10; display: flex; align-items: center; justify-content: center;
  }
  #joystick::after {
    content: ''; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  }

  /* 底部右侧方向与盲杖 */
  #rightControls {
    position: fixed; bottom: 40px; right: 40px;
    display: flex; align-items: center; gap: 20px; z-index: 10;
  }
  #rightControls .arrow {
    width: 40px; height: 40px; border-top: 3px solid rgba(255,255,255,0.4);
    border-right: 3px solid rgba(255,255,255,0.4); cursor: pointer;
  }
  #rightControls .arrow.left { transform: rotate(-135deg); }
  #rightControls .arrow.right { transform: rotate(45deg); }
  #rightControls .caneIcon {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
  }
  #rightControls .caneIcon svg {
    width: 30px; height: 30px; fill: rgba(255,255,255,0.7);
  }

  /* 开始与结束屏幕 */
  #startScreen {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; cursor: pointer; transition: opacity 1.5s ease;
  }
  #startScreen .title {
    font-size: 40px; font-weight: 200; letter-spacing: 25px;
    color: #f5c842; margin-bottom: 80px; text-indent: 25px;
  }
  #startScreen .btn { font-size: 14px; letter-spacing: 6px; color: rgba(255,255,255,0.5); }
  #startScreen .sub { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.2); margin-top: 30px; }

  #ending {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px; background: rgba(0,0,0,0); opacity: 0;
    transition: opacity 2s ease, background 2s ease;
    pointer-events: none; z-index: 20;
  }
  #ending.show { opacity: 1; background: rgba(0,0,0,0.95); pointer-events: auto; }
  #ending .title { font-size: 18px; font-weight: 400; color: #f5c842; letter-spacing: 10px; margin-bottom: 40px; }
  #ending .text { font-size: 14px; line-height: 2.4; color: rgba(255,255,255,0.4); letter-spacing: 1px; max-width: 420px; white-space: pre-line; }
  #ending .restart {
    margin-top: 60px; background: transparent; border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.3); padding: 12px 40px; border-radius: 30px;
    font-size: 12px; letter-spacing: 6px; cursor: pointer; transition: all 0.5s; font-family: inherit;
  }
  #ending .restart:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<!-- 顶部 UI -->
<div id="topBar">
  <div class="tab">第一章</div>
  <div class="tab active">第二章</div>
  <div class="tab">第三章</div>
  <div class="tab">第四章</div>
</div>

<!-- 任务提示 -->
<div id="quest">穿过中央花园，到达观海平台。</div>

<!-- 底部左侧摇杆 -->
<div id="joystick"></div>

<!-- 底部右侧方向与盲杖 -->
<div id="rightControls">
  <div class="arrow left"></div>
  <div class="caneIcon">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
  </div>
  <div class="arrow right"></div>
</div>

<!-- 开始屏幕 -->
<div id="startScreen">
  <div class="title">见</div>
  <div class="btn">点击屏幕 · 开始体验</div>
  <div class="sub">移动鼠标 · 用盲杖感知前方</div>
</div>

<!-- 结束屏幕 -->
<div id="ending">
  <div class="title">一段盲道</div>
  <div class="text" id="endingText"></div>
  <button class="restart" onclick="location.reload()">再走一次</button>
</div>

<canvas id="c"></canvas>

<script>
(function() {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var endingEl = document.getElementById('ending');
  var endingTextEl = document.getElementById('endingText');
  var startScreen = document.getElementById('startScreen');

  var W, H, DPR;
  var startTime = 0;
  var mouseX = 0, mouseY = 0;
  var started = false;
  var finished = false;
  var audioCtx = null;

  var DURATION = 30000; // 30秒
  var REVEAL_START = 0.90; // 最后3秒揭晓
  var REVEAL_DUR = 0.10;
  var SENSE_RADIUS = 150; // 碰撞检测半径（盲杖尖端）
  var LIGHT_RADIUS = 130; // 聚光灯半径（极小的可视范围）

  var tactileNodes = [];
  var obstacles = [];

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
  function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  // ========== 物理音效引擎 ==========
  function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }

  var noiseBuffer = null;
  function createNoiseBuffer() {
    var bufferSize = audioCtx.sampleRate * 0.5;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function playStrikeSound(type) {
    if (!audioCtx) return;
    if (!noiseBuffer) noiseBuffer = createNoiseBuffer();
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var noise = audioCtx.createBufferSource();
    var noiseGain = audioCtx.createGain();
    var filter = audioCtx.createBiquadFilter();

    noise.buffer = noiseBuffer;

    switch(type) {
      case 'tree': // 树木：沉闷低音
        osc.type = 'sine'; osc.frequency.value = 140;
        gain.gain.setValueAtTime(0.15, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
        filter.type = 'lowpass'; filter.frequency.value = 400;
        noiseGain.gain.setValueAtTime(0.1, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
        break;
      case 'pole': // 电线杆：金属清脆
        osc.type = 'triangle'; osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.08, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
        filter.type = 'highpass'; filter.frequency.value = 2000;
        noiseGain.gain.setValueAtTime(0.05, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.05);
        break;
      case 'bike': // 自行车：金属+橡胶
        osc.type = 'square'; osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.05, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
        filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 1;
        noiseGain.gain.setValueAtTime(0.06, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
        break;
      case 'car': // 汽车：厚重金属
        osc.type = 'sine'; osc.frequency.value = 80;
        gain.gain.setValueAtTime(0.2, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
        filter.type = 'lowpass'; filter.frequency.value = 250;
        noiseGain.gain.setValueAtTime(0.12, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
        break;
      case 'trash': // 垃圾桶：空腔塑料
        osc.type = 'triangle'; osc.frequency.value = 350;
        gain.gain.setValueAtTime(0.1, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
        filter.type = 'peaking'; filter.frequency.value = 800; filter.Q.value = 2;
        noiseGain.gain.setValueAtTime(0.08, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
        break;
      case 'hydrant': // 消防栓：铁质沉闷
        osc.type = 'sine'; osc.frequency.value = 180;
        gain.gain.setValueAtTime(0.12, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
        filter.type = 'lowpass'; filter.frequency.value = 500;
        noiseGain.gain.setValueAtTime(0.06, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
        break;
    }

    osc.connect(gain); gain.connect(audioCtx.destination);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

    osc.start(t0); osc.stop(t0 + 0.5);
    noise.start(t0); noise.stop(t0 + 0.5);
  }

  // ========== 路径与场景 ==========
  function pathPoint(t) {
    var x = W * 0.5 + Math.sin(t * Math.PI * 1.4 + 0.3) * W * 0.16;
    var y = H * 1.05 - t * H * 1.05;
    return { x: x, y: y };
  }

  function buildScene() {
    tactileNodes = [];
    obstacles = [];

    var nodeCount = 180;
    for (var i = 0; i < nodeCount; i++) {
      var t = i / (nodeCount - 1);
      var p = pathPoint(t);
      tactileNodes.push({ x: p.x, y: p.y });
    }

    var baseSize = clamp(Math.min(W, H) / 600, 0.8, 2.0);

    var layout = [
      { type: 'tree',    t: 0.10, ox: -0.18 },
      { type: 'pole',    t: 0.20, ox:  0.14 },
      { type: 'bike',    t: 0.32, ox:  0.02 },
      { type: 'trash',   t: 0.44, ox: -0.10 },
      { type: 'car',     t: 0.56, ox:  0.16 },
      { type: 'hydrant', t: 0.68, ox:  0.06 },
      { type: 'bike',    t: 0.78, ox: -0.08 },
      { type: 'tree',    t: 0.88, ox:  0.14 },
      { type: 'pole',    t: 0.96, ox: -0.12 }
    ];

    for (var j = 0; j < layout.length; j++) {
      var it = layout[j];
      var pp = pathPoint(it.t);
      obstacles.push({
        type: it.type,
        x: pp.x + W * it.ox,
        y: pp.y,
        scale: baseSize,
        lastSoundTime: -9999
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    buildScene();

    if (!started) {
      mouseX = W * 0.5;
      mouseY = H * 0.75;
    }
  }

  // ========== 精细障碍物绘制（白色线条） ==========
  function drawTree(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-2, -70); ctx.lineTo(2, -70); ctx.lineTo(4, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(-25, -55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(22, -65); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -105, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-20, -120, 25, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(22, -100, 28, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawPole(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-4, -150); ctx.lineTo(4, -150); ctx.lineTo(5, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-35, -140); ctx.lineTo(35, -140); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-25, -150); ctx.lineTo(-25, -130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(25, -150); ctx.lineTo(25, -130); ctx.stroke();
    ctx.beginPath(); ctx.arc(-25, -130, 3, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(25, -130, 3, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawBike(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(-40, 0, 20, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-40, 0, 15, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(40, 0, 20, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(40, 0, 15, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(-15, -22); ctx.lineTo(25, -22); ctx.lineTo(40, 0);
    ctx.moveTo(-15, -22); ctx.lineTo(10, 0); ctx.lineTo(-40, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(25, -22); ctx.lineTo(32, -38); ctx.lineTo(48, -38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-15, -22); ctx.lineTo(-20, -32); ctx.lineTo(-30, -32); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, -12, 6, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -12); ctx.lineTo(12, -6); ctx.stroke();
    ctx.restore();
  }

  function drawCar(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-70, 0); ctx.lineTo(-70, -25); ctx.lineTo(-45, -25);
    ctx.lineTo(-30, -55); ctx.lineTo(25, -55); ctx.lineTo(40, -25);
    ctx.lineTo(70, -25); ctx.lineTo(70, 0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-25, -30); ctx.lineTo(-25, -50); ctx.lineTo(18, -50);
    ctx.lineTo(32, -30); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-45, 0, 13, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-45, 0, 8, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(45, 0, 13, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(45, 0, 8, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(70, -15); ctx.lineTo(75, -15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-70, -15); ctx.lineTo(-75, -15); ctx.stroke();
    ctx.restore();
  }

  function drawTrash(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-20, 0); ctx.lineTo(-22, -60); ctx.lineTo(22, -60);
    ctx.lineTo(20, 0); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-28, -60); ctx.lineTo(28, -60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-28, -62); ctx.lineTo(-28, -58); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(28, -62); ctx.lineTo(28, -58); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -65, 8, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-21, -20); ctx.lineTo(21, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-21.5, -40); ctx.lineTo(21.5, -40); ctx.stroke();
    ctx.restore();
  }

  function drawHydrant(x, y, s, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, 0); ctx.lineTo(-14, -45); ctx.lineTo(-17, -55);
    ctx.lineTo(17, -55); ctx.lineTo(14, -45); ctx.lineTo(14, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, -55); ctx.lineTo(-6, -65); ctx.lineTo(6, -65); ctx.lineTo(10, -55); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -68, 4, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -35); ctx.lineTo(-22, -35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, -35); ctx.lineTo(22, -35); ctx.stroke();
    ctx.beginPath(); ctx.arc(-22, -35, 4, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(22, -35, 4, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawObstacle(o, a) {
    switch (o.type) {
      case 'tree':    drawTree(o.x, o.y, o.scale, a); break;
      case 'pole':    drawPole(o.x, o.y, o.scale, a); break;
      case 'bike':    drawBike(o.x, o.y, o.scale, a); break;
      case 'car':     drawCar(o.x, o.y, o.scale, a); break;
      case 'trash':   drawTrash(o.x, o.y, o.scale, a); break;
      case 'hydrant': drawHydrant(o.x, o.y, o.scale, a); break;
    }
  }

  // ========== 方向指示 ==========
  function drawDirectionIndicators() {
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#f5c842';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var positions = [0.04, 0.14, 0.24, 0.34, 0.44, 0.54, 0.64, 0.74, 0.84, 0.94];
    for (var i = 0; i < positions.length; i++) {
      var t = positions[i];
      var p1 = pathPoint(t);
      var p2 = pathPoint(Math.min(t + 0.01, 1));
      var angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);
      ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(5, 0); ctx.lineTo(-8, 8); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ========== 主渲染 ==========
  function render(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;
    var t = clamp(elapsed / DURATION, 0, 1);

    // 纯黑背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    var revealT = clamp((t - REVEAL_START) / REVEAL_DUR, 0, 1);
    var revealAlpha = smoothstep(revealT);

    // 方向指示（极暗，只起辅助作用）
    if (!finished) drawDirectionIndicators();

    // ==========================================
    // 核心：盲杖尖端聚光灯（完美模拟《见》的视觉）
    // ==========================================
    if (!finished && started) {
      ctx.save();

      // 1. 绘制光照范围内的内容
      ctx.save();
      ctx.beginPath();
      // 聚光灯范围：光标周围的小圆
      ctx.arc(mouseX, mouseY, LIGHT_RADIUS, 0, Math.PI * 2);
      ctx.clip();

      // 绘制盲道（黄色）
      for (var i = 0; i < tactileNodes.length; i++) {
        var n = tactileNodes[i];
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#e6b93a';
        var sz = 2.2;
        ctx.beginPath(); ctx.arc(n.x, n.y, sz, 0, Math.PI * 2); ctx.fill();
        if (i < tactileNodes.length - 1) {
          var next = tactileNodes[i + 1];
          var ddx = next.x - n.x, ddy = next.y - n.y;
          var len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          var px = -ddy / len, py = ddx / len;
          var off = 5.5;
          ctx.beginPath(); ctx.arc(n.x + px * off, n.y + py * off, sz, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(n.x - px * off, n.y - py * off, sz, 0, Math.PI * 2); ctx.fill();
        }
      }

      // 绘制障碍物（白色线条）
      for (var j = 0; j < obstacles.length; j++) {
        drawObstacle(obstacles[j], 0.9);
      }

      ctx.restore();

      // 2. 在光照范围外覆盖渐变黑，让边缘柔化
      var maskGrad = ctx.createRadialGradient(mouseX, mouseY, LIGHT_RADIUS * 0.6, mouseX, mouseY, LIGHT_RADIUS);
      maskGrad.addColorStop(0, 'rgba(0,0,0,0)');
      maskGrad.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = maskGrad;
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, LIGHT_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // 3. 盲杖的微弱光晕（只照亮尖端）
      var glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 60);
      glow.addColorStop(0, 'rgba(245, 200, 66, 0.15)');
      glow.addColorStop(1, 'rgba(245, 200, 66, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 60, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    // ---- 揭晓阶段：整体显示 ----
    if (revealAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = revealAlpha * 0.85;
      for (var m = 0; m < tactileNodes.length; m++) {
        var tn = tactileNodes[m];
        ctx.fillStyle = '#e6b93a';
        ctx.beginPath(); ctx.arc(tn.x, tn.y, 2.2, 0, Math.PI * 2); ctx.fill();
        if (m < tactileNodes.length - 1) {
          var tn2 = tactileNodes[m + 1];
          var ddx2 = tn2.x - tn.x, ddy2 = tn2.y - tn.y;
          var len2 = Math.sqrt(ddx2 * ddx2 + ddy2 * ddy2) || 1;
          var px2 = -ddy2 / len2, py2 = ddx2 / len2;
          var off2 = 5.5;
          ctx.beginPath(); ctx.arc(tn.x + px2 * off2, tn.y + py2 * off2, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(tn.x - px2 * off2, tn.y - py2 * off2, 2.2, 0, Math.PI * 2); ctx.fill();
        }
      }
      for (var n2 = 0; n2 < obstacles.length; n2++) {
        drawObstacle(obstacles[n2], revealAlpha * 0.85);
      }
      ctx.restore();
    }

    // ---- 碰撞检测与物理音效 ----
    if (!finished && started) {
      var cx = mouseX, cy = mouseY;
      for (var k = 0; k < obstacles.length; k++) {
        var o = obstacles[k];
        var ox = cx - o.x, oy = cy - o.y;
        var od = Math.sqrt(ox * ox + oy * oy);
        if (od < SENSE_RADIUS && ts - o.lastSoundTime > 800) {
          o.lastSoundTime = ts;
          playStrikeSound(o.type);
        }
      }
    }

    // ---- 盲杖图标（屏幕右下角，模拟第一人称手握盲杖） ----
    if (!finished && started) {
      drawCaneIcon();
    }

    // ---- 结束 ----
    if (t >= 1 && !finished) {
      finished = true;
      showEnding();
    }

    if (t < 1) requestAnimationFrame(render);
  }

  // ========== 盲杖图标（屏幕右下角） ==========
  function drawCaneIcon() {
    ctx.save();
    var bx = W - 100;
    var by = H - 100;
    
    // 圆形背景
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI * 2); ctx.stroke();

    // 盲杖线条（从图标中心延伸到光标位置）
    var angle = Math.atan2(mouseY - by, mouseX - bx);
    var caneLen = 60;
    var ex = bx + Math.cos(angle) * caneLen;
    var ey = by + Math.sin(angle) * caneLen;
    
    ctx.strokeStyle = 'rgba(245, 200, 66, 0.6)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();

    // 杖尖
    ctx.fillStyle = '#f5c842';
    ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI * 2); ctx.fill();
    
    // 手部提示
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
    
    ctx.restore();
  }

  // ========== 结束 ==========
  function showEnding() {
    document.body.style.cursor = 'default';
    endingTextEl.innerText =
      '你走了 30 秒。\n' +
      '在黑暗中，每一步\n' +
      '都只能靠一根盲杖，\n' +
      '一点点试探出前面的世界。\n\n' +
      '而这是他们每天的路。';
    setTimeout(function() {
      endingEl.classList.add('show');
      playStrikeSound('tree');
    }, 600);
  }

  // ========== 事件 ==========
  function onMove(x, y) {
    mouseX = x; mouseY = y;
  }

  document.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('resize', resize);

  // ========== 启动 ==========
  function startExperience() {
    if (started) return;
    started = true;
    startScreen.style.opacity = '0';
    setTimeout(function() { startScreen.style.display = 'none'; }, 1500);
    document.body.style.cursor = 'none';
    initAudio();
    startTime = performance.now();
    requestAnimationFrame(render);
  }

  startScreen.addEventListener('click', startExperience);
  startScreen.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startExperience();
  }, { passive: false });

  resize();
})();
</script>
</body>
</html>
